<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — devhandbook.io</title>
    <meta name="description" content="The page you're looking for doesn't exist. Browse free developer tools and the self-hosting blog instead.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://devhandbook.io/404.html">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/apple-redesign.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #fbfbfd; --text: #1d1d1f; --text-2: #6e6e73; --accent: #0071e3;
            --surface: rgba(255,255,255,0.82); --border: rgba(0,0,0,0.07);
        }
        html.dark {
            --bg: #000; --text: #f5f5f7; --text-2: #98989d; --accent: #2997ff;
            --surface: rgba(28,28,30,0.85); --border: rgba(255,255,255,0.08);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
            max-width: 560px; width: 100%; text-align: center;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 24px; padding: 48px 40px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.05), 0 1px 3px rgba(0,0,0,0.04);
            backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
        }
        .code { font-size: 72px; font-weight: 700; color: var(--accent); letter-spacing: -0.03em; line-height: 1; }
        h1 { font-size: 24px; font-weight: 600; margin-top: 12px; }
        p { color: var(--text-2); font-size: 15px; line-height: 1.6; margin-top: 12px; }
        .btn {
            display: inline-block; margin-top: 28px; padding: 12px 24px; border-radius: 980px;
            background: var(--accent); color: #fff; text-decoration: none; font-weight: 500; font-size: 15px;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .btn:hover { transform: translateY(-1px); opacity: 0.92; }
        .links { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
        .links a { color: var(--accent); text-decoration: none; font-size: 14px; }
        .links a:hover { text-decoration: underline; }
    </style>
    <script>
        (function() {
            var d = document.documentElement;
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                d.classList.add('dark');
            }
        })();
    </script>
</head>
<body>
    <main class="card">
        <div class="code">404</div>
        <h1>This page doesn't exist</h1>
        <p>The link you followed may be outdated, or the URL may have a typo. The tool or article may have moved.</p>
        <a class="btn" href="/">Browse All Developer Tools</a>
        <div class="links">
            <a href="/blog/">Self-Hosting Blog</a>
            <a href="/sitemap.xml">Sitemap</a>
            <a href="/">Home</a>
        </div>
    </main>
</body>
</html>
